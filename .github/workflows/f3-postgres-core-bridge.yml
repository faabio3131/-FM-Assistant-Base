name: F3 PostgreSQL Core Bridge Security Gate

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  postgres-bridge:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: assistant_f3
          POSTGRES_USER: assistant_f3
          POSTGRES_PASSWORD: synthetic_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant_f3 -d assistant_f3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FM_ASSISTANT_F3_POSTGRES_TEST_URL: postgresql+psycopg://assistant_f3:synthetic_ci_only@localhost:5432/assistant_f3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test-only PostgreSQL driver
        run: |
          python -m pip install -e ".[dev]" "psycopg[binary]>=3.2,<4"
          python -m pip check
      - name: Ruff PostgreSQL integration
        run: ruff check tests/saas/test_core_bridge_postgres.py
      - name: Real PostgreSQL migration/replay/revocation
        run: pytest tests/saas/test_core_bridge_postgres.py -q -rs
