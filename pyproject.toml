[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fm-assistant-base"
version = "0.1.0"
description = "Base SaaS multi-tenant para agentes de atendimento da FM Tecnologia"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "python-dotenv>=1.0,<2",
  "cryptography>=43,<47",
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/saas"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
ignore = ['B008', 'SIM102']
