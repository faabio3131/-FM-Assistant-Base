# REFERENCE CONFIGURATION ONLY — NOT APPLIED TO LIVE INFRASTRUCTURE
# Resolve host, certificate files, upstream network identity, rate budget
# and provider egress IP policies BEFORE deployment and external validation.
# Public edge: ONLY the native, per-instance token-protected endpoint.
# The internally signed /webhooks/fm-evolution/ route MUST remain private.
limit_req_zone $binary_remote_addr zone=fm_evolution_inbound:10m rate=10r/s;

upstream fm_assistant_private {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name hooks.example.invalid;
    ssl_certificate /etc/ssl/certs/replace-before-deploy.pem;
    ssl_certificate_key /etc/ssl/private/replace-before-deploy.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Prevent public clients from calling the trusted internal HMAC boundary.
    location ^~ /webhooks/fm-evolution/ {
        return 403;
    }

    location ^~ /webhooks/evolution-native/ {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        limit_req zone=fm_evolution_inbound burst=20 nodelay;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
        proxy_send_timeout 12s;
        proxy_request_buffering on;
        proxy_pass http://fm_assistant_private;
        proxy_set_header Host $host;
        proxy_set_header X-FM-Evolution-Signature "";
        proxy_set_header X-FM-Evolution-Timestamp "";
        proxy_set_header X-FM-Evolution-Token $http_x_fm_evolution_token;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Server;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
