# FM Assistant — Evolution API v2.3.7 preparation only.
# NOT a production deployment authorization. Do not expose database, Redis or Evolution on 0.0.0.0.
# Place TLS reverse proxy + strict ingress controls in front of 127.0.0.1:8080.
services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_URL: ${EVOLUTION_PUBLIC_HTTPS_URL:?HTTPS URL required}
      SERVER_PORT: "8080"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_POSTGRES_USER:?user required}:${EVOLUTION_POSTGRES_PASSWORD:?password required}@postgres:5432/${EVOLUTION_POSTGRES_DB:-evolution}
      DATABASE_CONNECTION_CLIENT_NAME: vendeatende_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/0
      CACHE_REDIS_PREFIX_KEY: vendeatende_evolution
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_LOCAL_ENABLED: "false"
      AUTHENTICATION_API_KEY: ${EVOLUTION_MASTER_API_KEY:?dedicated high-entropy key required}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      CORS_ORIGIN: ${EVOLUTION_ALLOWED_ORIGIN:?restricted origin required}
      QRCODE_LIMIT: "30"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution_internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EVOLUTION_POSTGRES_USER:?user required}
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:?password required}
      POSTGRES_DB: ${EVOLUTION_POSTGRES_DB:-evolution}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - evolution_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - evolution_internal

networks:
  evolution_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
